<header class="top">
  <div class="brandmark">Deal<span>·</span>desk</div>
  <div class="sub" id="who">—</div>
  <span class="dirty-dot" id="dirty-dot" hidden></span>
  <div class="spacer"></div>
  <div class="sub" id="deskcount"></div>
  <button class="btn" id="save" hidden>Saved</button>
</header>

<div class="ro-banner" id="ro-banner" hidden>
  Read-only view — you can look through these deals and comment, but not change them.
</div>

<div class="draft-bar" id="draft-bar" hidden>
  <span>Unsaved changes from <b id="draft-when"></b> are still on this device.</span>
  <button class="btn sm" id="draft-restore">Restore them</button>
  <button class="btn sm ghost" id="draft-discard">Discard</button>
</div>

<main id="desk">
  <div class="wrap">
    <div class="desk-head">
      <div>
        <h1>Your deals</h1>
        <p>Each one is a story you can walk an interviewer through. Click in to write it, brand it, or present it.</p>
      </div>
    </div>
    <div class="grid" id="grid"></div>
  </div>
</main>

<section class="deal" id="deal">
  <div class="pane">
    <div class="pane-head">
      <div class="crumb">
        <button class="btn ghost sm" id="back">← All deals</button>
        <h1 id="deal-name">—</h1>
      </div>
      <div class="crumb">
        <label class="sub" for="audience-pick" style="border:0;padding:0">Prepared for</label>
        <select id="audience-pick" style="width:auto;min-width:170px"></select>
        <div class="spacer" style="flex:1"></div>
        <button class="btn sm ghost danger" id="delete">Delete</button>
        <button class="btn sm" id="share">Share</button>
      </div>
    </div>
    <nav class="tabs">
      <button class="tab on" data-tab="notes">Notes</button>
      <button class="tab" data-tab="story">Story</button>
      <button class="tab" data-tab="map">Map</button>
      <button class="tab" data-tab="audience">Audience</button>
      <button class="tab" data-tab="checks">Checks<span class="n" id="tab-checks-n"></span></button>
    </nav>
    <div class="panel-body" id="panel-body"></div>
  </div>

  <div class="preview">
    <div class="preview-bar">
      <span class="label">Live preview</span>
      <div class="spacer" style="flex:1"></div>
      <span class="frame-size" id="frame-size"></span>
      <button class="btn sm ghost" id="reload">Reload</button>
      <button class="btn sm" id="present-btn">Present ↗</button>
    </div>
    <div class="frame-wrap" id="frame-wrap">
      <div class="frame-stage" id="frame-stage"><iframe id="frame" title="Deck preview"></iframe></div>
    </div>
  </div>
</section>

<div class="present" id="present"></div>
<div class="scrim" id="scrim"></div>
<div class="toast" id="toast"></div>
